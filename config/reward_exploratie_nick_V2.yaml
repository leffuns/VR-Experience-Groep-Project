behaviors:
  Sammy:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 50000
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 10000000
    time_horizon: 256
    summary_freq: 10000
